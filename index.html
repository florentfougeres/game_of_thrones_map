<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Carte de Westeros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="map"></div>

<div class="ui-layer">
  <div class="panel title-block">
    <h1>Carte de Westeros</h1>
    <p>Et le monde connu</p>
  </div>

  <div class="panel search-block">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Rechercher un lieu, une rivière, une région…" autocomplete="off" />
    </div>
    <div class="panel search-results" id="search-results"></div>
  </div>

  <div class="panel legend-block collapsed" id="legend-block">
    <div class="legend-header" id="legend-toggle">
      <span>Légende &amp; couches</span>
      <span class="chevron">▾</span>
    </div>
    <div class="legend-body">
      <div class="legend-row">
        <span class="legend-swatch dot" style="background:#404040;border:1px solid #ffffff"></span>
        <label for="chk-city">Villes</label>
        <input type="checkbox" id="chk-city" checked data-layers="lieux-circle-city,lieux-label-city" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch dot" style="width:8px;height:8px;background:#404040;border:1px solid #ffffff"></span>
        <label for="chk-town">Bourgs</label>
        <input type="checkbox" id="chk-town" checked data-layers="lieux-circle-town,lieux-label-town" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch square" style="background:#404040;border:1px solid #ffffff"></span>
        <label for="chk-castle">Châteaux</label>
        <input type="checkbox" id="chk-castle" checked data-layers="lieux-circle-castle,lieux-label-castle" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch dot" style="background:#c7c0d1;border:1px solid #8f889c"></span>
        <label for="chk-ruin">Ruines &amp; lieux divers</label>
        <input type="checkbox" id="chk-ruin" checked data-layers="lieux-circle-ruin,lieux-label-ruin" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch" style="background:rgba(122,178,140,0.45);border:1px solid rgba(122,178,140,0.85)"></span>
        <label for="chk-paysage">Paysages</label>
        <input type="checkbox" id="chk-paysage" checked data-layers="paysage-fill,paysage-label,paysage-label-generic" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch line" style="background:#e0a685"></span>
        <label for="chk-routes">Routes</label>
        <input type="checkbox" id="chk-routes" checked data-layers="routes-line,routes-label" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch line" style="background:#5fa0b3"></span>
        <label for="chk-water">Rivières &amp; lacs</label>
        <input type="checkbox" id="chk-water" checked data-layers="rivieres-line,rivieres-label,lacs-fill,lacs-outline,lacs-label" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch dashed"></span>
        <label for="chk-borders">Frontières</label>
        <input type="checkbox" id="chk-borders" checked data-layers="frontiere-line" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch line" style="background:#eef8fb;border:1px solid #5b7fa6"></span>
        <label for="chk-wall">Le Mur</label>
        <input type="checkbox" id="chk-wall" checked data-layers="mur-casing,mur-line,mur-label" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch label-swatch" style="color:#a68a5c;font-style:italic">Aa</span>
        <label for="chk-islands">Îles</label>
        <input type="checkbox" id="chk-islands" checked data-layers="iles-label" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch label-swatch" style="color:rgba(122,108,138,0.75);font-weight:700">Aa</span>
        <label for="chk-kingdoms">Royaumes</label>
        <input type="checkbox" id="chk-kingdoms" checked data-layers="politique-label" />
      </div>
      <div class="legend-row">
        <span class="legend-swatch label-swatch" style="color:#4a92a8;font-style:italic">Aa</span>
        <label for="chk-regions">Régions (mers, monts, déserts…)</label>
        <input type="checkbox" id="chk-regions" checked data-layers="regions-label" />
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
